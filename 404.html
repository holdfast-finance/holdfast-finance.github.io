<style>
  :root{--signal:#3DF5C8;--deepwater:#7B61FF;--abyss:#07080C;--hull:#0E1118;--text:#E8ECF4;--muted:#8A93A6;--hair:rgba(255,255,255,.08)}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--abyss);color:var(--text)}
  body{min-height:100vh;display:flex;flex-direction:column;font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(60rem 30rem at 10% -10%,rgba(61,245,200,.12),transparent 60%),radial-gradient(50rem 30rem at 110% 10%,rgba(123,97,255,.12),transparent 60%),var(--abyss)}
  .wrap{width:100%;max-width:960px;margin:0 auto;padding:0 16px}
  header{padding:24px 0}
  .brand{display:flex;align-items:center;gap:10px;font:600 20px/1 "Space Grotesk",Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:-.02em;color:var(--text);text-decoration:none}
  main{flex:1;display:flex;align-items:center}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--hair);border-radius:999px;background:rgba(14,17,24,.7);color:var(--muted);font:12px/1 ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,monospace}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--signal);box-shadow:0 0 10px var(--signal)}
  h1{margin:20px 0 16px;font:600 clamp(40px,8vw,76px)/1.02 "Space Grotesk",Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:-.03em}
  h1 em{font-style:normal;color:var(--signal)}
  p.lead{max-width:40rem;margin:0 0 28px;color:#C3C9D6;font-size:clamp(16px,2.2vw,19px)}
  .cta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:28px}
  .btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:10px;font-weight:600;text-decoration:none}
  .btn.primary{background:var(--signal);color:var(--abyss);box-shadow:0 0 24px rgba(61,245,200,.25)}
  .btn.ghost{background:var(--hull);color:var(--text);border:1px solid var(--hair)}
  .btn:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
  code{display:inline-block;max-width:100%;overflow-x:auto;padding:12px 16px;border:1px solid var(--hair);border-radius:10px;background:rgba(7,8,12,.8);font:14px/1.4 ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,monospace;color:var(--muted);white-space:nowrap}
  code b{color:var(--signal);font-weight:500}
  ul.points{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding:0;margin:40px 0 0;list-style:none}
  ul.points li{padding:16px;border:1px solid var(--hair);border-radius:12px;background:rgba(14,17,24,.7);color:#C3C9D6;font-size:14px}
  ul.points strong{display:block;color:var(--text);font-family:"Space Grotesk",Inter,sans-serif;margin-bottom:4px}
  footer{padding:32px 0;color:var(--muted);font-size:13px;border-top:1px solid var(--hair);margin-top:48px}
  footer .row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
  footer a{color:var(--muted)}
</style>
