<style>
  /* Fonts: self-hosted from @fontsource 5.3.0 (SIL OFL 1.1, see /fonts/OFL-*.txt) */
  @font-face{font-family:"Space Grotesk";font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/space-grotesk-latin-600-normal.woff2) format("woff2")}
  @font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/inter-latin-400-normal.woff2) format("woff2")}
  @font-face{font-family:Inter;font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/inter-latin-500-normal.woff2) format("woff2")}

  @font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
  @font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2")}

  :root{
    color-scheme:dark;
    --signal:#3DF5C8;--deepwater:#7B61FF;--abyss:#07080C;--hull:#0E1118;--well:#0A0C12;
    --text:#E8ECF4;--text-soft:#C3CAD8;--text-muted:#8A93A6;
    --signal-text:#3DF5C8;--deepwater-text:#8B74FF;--forecast-line:#B3A6FF;
    --line:#1F2636;--line-strong:#2A3346;--focus-ring:#3DF5C8;
    --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --display:"Space Grotesk",Inter,ui-sans-serif,system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{background:var(--abyss);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh;background:var(--abyss);color:var(--text);font:16px/1.6 var(--sans);position:relative;overflow-x:clip}
  a{color:var(--text);text-decoration:none}
  a:hover{color:var(--signal-text)}
  :focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:6px}
  .skip{position:absolute;left:16px;top:-60px;z-index:100;padding:10px 14px;border-radius:10px;background:var(--signal);color:var(--abyss);font-weight:600}
  .skip:focus{top:12px;color:var(--abyss)}

  /* Background: faint 64px grid + top Signal/Deepwater glow */
  .bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .bg::before{content:"";position:absolute;width:900px;height:900px;left:50%;top:-480px;margin-left:-450px;border-radius:50%;
    background:radial-gradient(circle,rgba(61,245,200,.20) 0%,rgba(123,97,255,.10) 40%,rgba(7,8,12,0) 70%)}
  .bg::after{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:64px 64px}

  .wrap{position:relative;z-index:1;width:100%;max-width:1200px;margin:0 auto;padding:0 24px}

  /* Sticky nav */
  .top{position:sticky;top:0;z-index:50;background:rgba(7,8,12,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid transparent}
  .top .wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-top:12px;padding-bottom:12px}
  .brand{display:flex;align-items:center;gap:10px;min-height:44px}
  .brand span{font:600 22px/1 var(--display);letter-spacing:-.03em}
  .brand:hover{color:var(--text)}
  nav ul{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0;padding:0;list-style:none;font-size:15px}
  nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 8px;color:var(--text-soft)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;font-weight:500;font-size:16px;white-space:nowrap;transition:box-shadow .2s,background-color .2s,border-color .2s}
  .btn-outline{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-strong);background:rgba(255,255,255,.03);font-size:14px}
  .btn-outline:hover{border-color:#3A4560}
  .btn-lg{min-height:52px;padding:0 26px}
  .btn-primary{background:var(--signal);color:var(--abyss);font-weight:600;box-shadow:0 0 36px rgba(61,245,200,.40)}
  .btn-primary:hover{color:var(--abyss);box-shadow:0 0 48px rgba(61,245,200,.55)}
  .btn-secondary{border:1px solid var(--line-strong);background:rgba(255,255,255,.03)}
  .btn-secondary:hover{border-color:#3A4560}

  section{scroll-margin-top:96px}
  [id]{scroll-margin-top:96px}

  /* Hero */
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:28px;padding:112px 0 64px}
  .pill{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:6px 14px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(14,17,24,.8);font:13px/1.4 var(--mono);color:var(--text-soft)}
  .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--signal);box-shadow:0 0 10px var(--signal)}
  h1{margin:0;max-width:960px;font:600 clamp(44px,7vw,88px)/1 var(--display);letter-spacing:-.045em}
  .accent{color:var(--signal-text)}
  .lead{margin:0;max-width:680px;font-size:20px;line-height:1.55;color:var(--text-soft)}
  .ctas{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
  .cmd{max-width:100%;overflow-x:auto;font:15px/1.5 var(--mono);background:rgba(5,6,10,.9);border:1px solid var(--line);border-radius:12px;padding:14px 20px;color:var(--text-soft);white-space:nowrap}
  .cmd .ps{color:var(--text-muted);user-select:none}
  .cmd b{font-weight:500;color:var(--signal-text)}

  /* Demo strip */
  .demo{padding:0 0 96px}
  .glass{border-radius:24px;padding:1px;background:linear-gradient(140deg,rgba(61,245,200,.6),rgba(123,97,255,.45) 50%,rgba(31,38,54,.6))}
  .glass-in{border-radius:23px;background:var(--well);padding:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
  .tile{background:var(--hull);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}
  .tile-label{font-size:13px;color:var(--text-muted)}
  .money{font:500 34px/1.2 var(--mono);font-variant-numeric:tabular-nums}
  .tile svg{display:block;width:100%}
  .tile-note{font-size:13px;color:var(--text-soft)}
  .quote{margin:0;font-size:15px;line-height:1.5;color:var(--text)}
  .chip{display:inline-flex;align-self:flex-start;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:rgba(61,245,200,.12);color:var(--signal-text);font-size:13px;font-weight:500}

  /* Features */
  .features{padding:0 0 96px;display:flex;flex-direction:column;gap:32px}
  .eyebrow{font:13px/1.4 var(--mono);letter-spacing:.1em;color:var(--signal-text)}
  .features header{display:flex;flex-direction:column;gap:12px;max-width:720px}
  h2{margin:0;font:600 clamp(32px,4.5vw,52px)/1.05 var(--display);letter-spacing:-.035em}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin:0;padding:0;list-style:none}
  .card{background:rgba(14,17,24,.8);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:12px}
  .card.hi{background:linear-gradient(160deg,rgba(61,245,200,.10),rgba(123,97,255,.10)),var(--abyss);border-color:var(--line-strong)}
  .card svg{flex:none}
  h3{margin:0;font:600 22px/1.3 var(--display)}
  .card p{margin:0;font-size:15px;line-height:1.55;color:var(--text-soft)}

  /* CTA panel */
  .cta{padding:0 0 96px}
  .panel{border:1px solid var(--line);border-radius:24px;background:rgba(14,17,24,.8);padding:48px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px}
  .panel h2{font-size:clamp(30px,4vw,48px)}
  .panel p{margin:0;font-size:18px;line-height:1.55;color:var(--text-soft);max-width:560px}
  .panel .fine{font-size:14px;color:var(--text-muted)}

  footer{position:relative;z-index:1}
  .foot{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;padding:32px 0 48px;border-top:1px solid var(--line);font-size:14px;color:var(--text-muted)}
  .foot a{display:inline-flex;align-items:center;min-height:44px;margin:-13px 0;color:var(--text-muted);text-decoration:underline;text-underline-offset:3px}
  .foot a:hover{color:var(--signal-text)}

  @media (max-width:720px){
    .wrap{padding:0 16px}
    .top .wrap{gap:0 12px;padding-top:6px;padding-bottom:4px}
    .top nav{order:3;width:100%}
    nav ul{gap:0 4px;margin-left:-8px}
    .top .btn-outline{order:2}
    section,[id]{scroll-margin-top:120px}
    .hero{padding:48px 0 56px;gap:24px}
    .lead{font-size:18px}
    .ctas{flex-direction:column;align-items:center}
    .cmd{font-size:14px;padding:14px 16px}
    .glass-in{padding:16px;gap:16px}
    .grid{grid-template-columns:1fr}
    .card{padding:24px}
    .panel{padding:40px 20px}
    .demo,.features,.cta{padding-bottom:72px}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{transition:none!important;animation:none!important}
  }
  .nf{min-height:calc(100vh - 260px);justify-content:center}
</style>
</head>
